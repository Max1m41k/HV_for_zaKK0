# -Xmx2G: с 1G Loom не успевает смержить client+server и отремапить 46 модов —
# демон убивается по памяти посреди записи jar, и кэш калечится (см. PORT-1.21.11.md, «Фикс3»).
# -Djava.net.preferIPv4Stack=true: на этой машине IPv6 есть в DNS, но соединения по нему не
# проходят; JVM иногда берёт AAAA-адрес первым и висит до connectTimeout — на этом падал
# онлайн-гейт :genHvSignature (SocketTimeoutException), хотя воркер отвечал curl за 0.5 с.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Djava.net.preferIPv4Stack=true
# Новый JVM на каждую сборку: zipfs-хендлеры Loom живут в процессе демона, и переиспользование
# демона после-abrupt termination = ClosedFileSystemException на все последующие попытки.
org.gradle.daemon=false
org.gradle.parallel=true
